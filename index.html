<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta property="og:description" content="A Pokémon virtual pet in your browser: raise it, battle, catch, and play with buddies.">

<style>
  :root { --fit: min(92vw, calc(100vh - 110px)); --side: min(var(--fit), 260px);
    --ring: calc(var(--side) * 0.025); --band: calc(var(--side) * 0.04); }
  html, body { margin: 0; height: 100%; background: #000; color: #9a9a9a; overflow: hidden;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* the Knomi screen in a Poke Ball ring, centered both ways */
  /* with the mouse over it the ring grows outward to twice its width, like the Mac app's; the screen
     stays put. Only for a real mouse: on a phone a tap would leave it grown. As thick as the Mac app's
     (6 of its 240 points, 12 with the mouse over it); the black band keeps its own height */
  @property --grow { syntax: '<length>'; inherits: true; initial-value: 0px; }
  #ball { position: absolute; left: 50%; top: 50%; width: calc(var(--side) + 2 * var(--grow));
    height: calc(var(--side) + 2 * var(--grow)); transition: --grow .15s ease-out;
    transform: translate(-50%, -50%); border-radius: 50%; box-sizing: border-box;
    background: linear-gradient(#de2121 0 calc(50% - var(--band) / 2), #000 0 calc(50% + var(--band) / 2), #fff 0); }
  @media (hover: hover) and (pointer: fine) { #ball:hover { --grow: var(--ring); } }
  #screen { position: absolute; inset: calc(var(--ring) + var(--grow)); width: calc(100% - 2 * (var(--ring) + var(--grow)));
    height: calc(100% - 2 * (var(--ring) + var(--grow))); border-radius: 50%; background: #000;
    image-rendering: pixelated; touch-action: none; cursor: pointer; }
  #bar { position: absolute; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom));
    display: flex; gap: 14px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 0 16px; }
  #bar button, #bar label { background: none; border: 1px solid #333; color: #9a9a9a; border-radius: 14px;
    padding: 4px 12px; font: inherit; cursor: pointer; }
  #bar button:hover, #bar label:hover { border-color: #666; color: #ddd; }
  #hint { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; }
  #upd { position: absolute; top: max(34px, calc(env(safe-area-inset-top) + 24px)); left: 50%; transform: translateX(-50%);
    display: none; background: #1e7d3c; color: #fff; border: 0; border-radius: 14px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #ddd; }
  @media (max-height: 520px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="hint">Tap, hold and swipe the screen · ← → tilt · arrows walk in PokeDungeon · Space: wild battle</div>
<script>  // a phone has no arrow keys or Space: it tilts
  if (matchMedia('(pointer: coarse)').matches) document.getElementById('hint').textContent = 'Tap, hold and swipe the screen · Tilt to aim';
</script>
<div id="ball"><canvas id="screen" width="466" height="466"></canvas></div>
<div id="msg">Loading…</div>
<button id="upd" type="button">New version · Reload</button>
<div id="bar">
  <button id="tilt" type="button" hidden>Enable tilt</button>
  <button id="size" type="button">Size: Small</button>
  <button id="sound" type="button">Sound on</button>
  <button id="auto" type="button">Auto-update: On</button>
  <button id="vibe" type="button" hidden>Vibration: On</button>
  <button id="export" type="button">Export save</button>
  <label>Import save<input id="import" type="file" accept=".prefs,.txt" hidden></label>
  <span id="live" hidden></span>
  <a href="https://github.com/FedorSosnin/PokeKnomiGochi" style="color:#666">About</a>
</div>
<script>
'use strict';
const SIDE = 466, SAVE_FILE = '/save/pokeknomigochi.prefs';
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const img = ctx.createImageData(SIDE, SIDE);
const msg = document.getElementById('msg');
let skipSave = false;  // an import replaces the save: the running game must not write over it

const BUILD = 'ce00627d04';  // stamped by build.sh: every file of one version is fetched together
var Module = {
  noInitialRun: false,
  locateFile: (path) => path + '?v=' + BUILD,
  print: (t) => console.log(t),
  printErr: (t) => console.warn(t),
  // erased the save in the game, or imported one: save the files and start a fresh page
  saveAndReload() { sync(() => location.reload()); },
  onRuntimeInitialized() { claimTab(false); },
};

// ---- one tab at a time: they would share one save and write over each other ----
const tabs = 'BroadcastChannel' in self ? new BroadcastChannel('pokewebgochi') : null;
let running = false;
function claimTab(steal) {
  if (!navigator.locks) { startGame(); return; }  // very old browsers: no lock to take
  navigator.locks.request('pokewebgochi-save', steal ? { steal: true } : { ifAvailable: true }, (lock) => {
    if (!lock) { showElsewhere(); return; }
    startGame();
    return new Promise(() => {});  // held until this tab closes
  }).catch((e) => {               // another tab took over with "Play here"
    if (e && e.name !== 'AbortError') console.error(e);
    stopGame();
  });
}
function showElsewhere() {
  msg.innerHTML = 'PokeWebGochi is open in another tab.<br><br><button id="here" type="button">Play here</button>';
  document.getElementById('here').onclick = () => {
    msg.textContent = 'Loading…';
    if (tabs) tabs.postMessage('save');  // the other one saves first, then lets go
    setTimeout(() => claimTab(true), 400);
  };
}
if (tabs) tabs.onmessage = (e) => { if (e.data === 'save' && running) { Module._webSave(); sync(); } };
function stopGame() {
  running = false;
  if (relay) relay.close();
  skipSave = true;
  msg.textContent = 'PokeWebGochi moved to another tab.';
  if (!msg.isConnected) document.body.appendChild(msg);
}
function startGame() {
  if (running) return;
  if (!FS.analyzePath('/save').exists) {
    FS.mkdir('/save');
    FS.mount(Module.IDBFS || IDBFS, {}, "/save");
  }
  FS.syncfs(true, (err) => {  // the saved files, back from IndexedDB
    if (err) console.warn('save not read', err);
    running = true;
    skipSave = false;
    msg.remove();
    Module._webStart();
    requestAnimationFrame(frame);
    connectRelay();
    showLive();
    setInterval(showLive, 60000);
    setInterval(() => { if (running) sync(); }, 5000);  // the game writes its files on its own; this keeps IndexedDB current
    updateSoundButton();
    updateAutoButton();
  });
}

function sync(done) {
  FS.syncfs(false, (err) => { if (err) console.warn('save not stored', err); if (done) done(); });
}

// a hidden tab gets no animation frames: it keeps ticking once a second instead, so buddies still
// get answers, like a Knomi with its screen off
setInterval(() => { if (running && document.hidden) Module._webFrame(); }, 1000);

function frame() {
  if (!running) return;
  const p = Module._webFrame();
  if (p) {
    img.data.set(HEAPU8.subarray(p, p + SIDE * SIDE * 4));
    ctx.putImageData(img, 0, 0);
  }
  requestAnimationFrame(frame);
}
// a hidden tab gets no animation frames: the game keeps its time from the clock and
// catches up when it comes back, like a Knomi with the screen off
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running && !skipSave) { Module._webSave(); sync(); }  // not while it still loads
});
addEventListener('pagehide', () => { if (running && !skipSave) { Module._webSave(); sync(); } });

// ---- touch and mouse: a finger on the 466 x 466 canvas ----
function point(e) {
  const r = canvas.getBoundingClientRect();
  return [Math.round((e.clientX - r.left) * SIDE / r.width), Math.round((e.clientY - r.top) * SIDE / r.height)];
}
// the mouse is a finger: it presses while the button is down (the same hand, a little lower)
const HAND = 'M8 2.5a2 2 0 0 1 4 0V11l1-.2a2 2 0 0 1 2.2 1l.3.6.7-.1a2 2 0 0 1 2.3 1.2l.2.5.6-.1a2 2 0 0 1 ' +
  '2.4 2V20c0 3.6-2.9 6.5-6.5 6.5h-2.2a6.5 6.5 0 0 1-5.4-2.9L3.4 17.2a1.9 1.9 0 0 1 2.9-2.4L8 16.6Z';
function handCursor(dx, dy) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="25" height="30"><path transform="translate(${dx} ${dy})" ` +
    `d="${HAND}" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}") 10 1, pointer`;
}
const FINGER = handCursor(0, 0), FINGER_DOWN = handCursor(1, 2);
canvas.style.cursor = FINGER;
let down = false;
canvas.addEventListener('pointerdown', (e) => {
  startAudio();
  canvas.setPointerCapture(e.pointerId);
  down = true;
  if (e.pointerType === 'mouse') canvas.style.cursor = FINGER_DOWN;
  const [x, y] = point(e);
  Module._webPointer(x, y, 1);
  e.preventDefault();
});
canvas.addEventListener('pointermove', (e) => {
  if (down) { const [x, y] = point(e); Module._webPointer(x, y, 1); return; }
  Module._webHover();
  if (e.pointerType === 'mouse' && Module._webHoverAt) { const [x, y] = point(e); Module._webHoverAt(x, y); }  // its control outlined
});
canvas.addEventListener('pointerleave', () => { if (Module._webHoverAt) Module._webHoverAt(-1, -1); });
for (const ev of ['pointerup', 'pointercancel']) {
  canvas.addEventListener(ev, (e) => {
    if (!down) return;
    down = false;
    canvas.style.cursor = FINGER;
    const [x, y] = point(e);
    Module._webPointer(x, y, 0);
  });
}
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('touchend', startTilt);  // a finished tap: the moment iPhones accept the question

// ---- keys: arrows tilt (and walk in PokeDungeon), Space is the Knomi's button ----
const keys = { left: false, right: false, up: false, down: false };
function key(e, isDown) {
  if (e.key === 'ArrowLeft') keys.left = isDown;
  else if (e.key === 'ArrowRight') keys.right = isDown;
  else if (e.key === 'ArrowUp') keys.up = isDown;
  else if (e.key === 'ArrowDown') keys.down = isDown;
  else if (e.key === ' ') { if (!e.repeat) Module._webButton(isDown ? 1 : 0); }
  else return;
  startAudio();
  Module._webTilt(keys.left ? 1 : 0, keys.right ? 1 : 0);
  Module._webArrows(keys.up ? 1 : 0, keys.down ? 1 : 0);
  e.preventDefault();
}
addEventListener('keydown', (e) => key(e, true));
addEventListener('keyup', (e) => key(e, false));

// ---- sound: the game's mono (48 kHz), pulled by the browser ----
let audio = null;
function startAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
  const rate = Module._webAudioRate();
  try { audio = new AudioContext({ sampleRate: rate }); } catch (e) { audio = new AudioContext(); }
  const n = 1024, step = rate / audio.sampleRate;
  const buf = Module._malloc(n * 2);
  const node = audio.createScriptProcessor(n, 0, 1);
  let src = new Int16Array(0), pos = 0;
  node.onaudioprocess = (ev) => {
    const out = ev.outputBuffer.getChannelData(0);
    for (let i = 0; i < out.length; i++) {
      if (pos >= src.length) {  // the next block from the game
        Module._webAudio(buf, n);
        src = new Int16Array(HEAP16.buffer, buf, n).slice();
        pos = 0;
      }
      out[i] = src[Math.floor(pos)] / 32768;
      pos += step;
    }
  };
  node.connect(audio.destination);
}

// ---- sound on/off: the same setting as the SND switch on the clock screen ----
const soundBtn = document.getElementById('sound');
function updateSoundButton() { soundBtn.textContent = Module._webSoundOn() ? 'Mute' : 'Unmute'; }
soundBtn.addEventListener('click', () => {
  Module._webSetSound(Module._webSoundOn() ? 0 : 1);
  updateSoundButton();
  startAudio();
});

// ---- vibration: a short buzz with each sound effect, on phones whose browser can (Android;
// iPhones can't). Its own switch, kept in this browser; muting the sound doesn't stop it. ----
const vibeBtn = document.getElementById('vibe');
const canVibe = typeof navigator.vibrate === 'function' && matchMedia('(pointer: coarse)').matches;
let vibeOn = true;
try { vibeOn = localStorage.getItem('pwg-vibrate') !== 'off'; } catch (e) {}
// ms (or on/off patterns) per effect, in audio.h's Sfx order: tap, eat, play, heart, hatch, evolve,
// medal, deny, bye, level, shake 1-3
const BUZZ = [8, 20, 12, [15, 40, 15], [40, 60, 80], [60, 60, 60, 60, 120], [30, 40, 60], [40, 30, 40], 80, [20, 40, 40], 30, 30, 30];
Module.haptic = (sfx) => {
  if (canVibe && vibeOn && BUZZ[sfx] !== undefined) try { navigator.vibrate(BUZZ[sfx]); } catch (e) {}
};
function updateVibeButton() { vibeBtn.textContent = 'Vibration: ' + (vibeOn ? 'On' : 'Off'); }
if (canVibe) { vibeBtn.hidden = false; updateVibeButton(); }
vibeBtn.addEventListener('click', () => {
  vibeOn = !vibeOn;
  try { localStorage.setItem('pwg-vibrate', vibeOn ? 'on' : 'off'); } catch (e) {}
  updateVibeButton();
  if (vibeOn) try { navigator.vibrate(20); } catch (e) {}  // a taste of it
});

// ---- tilt: a phone's own tilt, like the Knomi's. iPhones only let a page ask from a finished tap
// (not a finger going down), so it asks on the first one, and an "Enable tilt" button stays
// until the answer is yes. ----
const tiltBtn = document.getElementById('tilt');
const tiltNeedsAsk = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
let tiltState = 'off';  // off, asking, on, denied
function tiltOn() {
  tiltState = 'on';
  tiltBtn.hidden = true;
  addEventListener('deviceorientation', onTilt);
}
function startTilt() {
  if (tiltState !== 'off' || typeof DeviceOrientationEvent === 'undefined') return;
  if (!tiltNeedsAsk) { tiltOn(); return; }
  tiltState = 'asking';
  DeviceOrientationEvent.requestPermission().then((answer) => {
    if (answer === 'granted') tiltOn();
    else { tiltState = 'denied'; tiltBtn.textContent = 'Tilt is off'; }  // iPhone keeps "no" until Safari is closed
  }).catch(() => { tiltState = 'off'; });  // not a tap the browser accepted: the button asks again
}
if (tiltNeedsAsk && matchMedia('(pointer: coarse)').matches) tiltBtn.hidden = false;
tiltBtn.addEventListener('click', () => { if (tiltState === 'denied') tiltState = 'off', tiltBtn.textContent = 'Enable tilt'; startTilt(); });
function onTilt(e) {
  if (e.gamma == null) return;
  const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  // left-right tilt as the player sees it, whichever way the phone is turned
  const t = angle === 90 ? e.beta : angle === 270 || angle === -90 ? -e.beta : angle === 180 ? -e.gamma : e.gamma;
  Module._webTiltSensor(Math.max(-1, Math.min(1, t / 30)));
}

// ---- buddies: browsers can't use the Knomi's local Wi-Fi messages, so they meet through the relay ----
let relay = null, relayIn = 0, relayTries = 0;
Module.relaySend = (bytes) => { if (relay && relay.readyState === 1) relay.send(bytes); };
// a copy served from this computer (a test build) only joins when asked (?relay=1), as the Mac and Windows
// test copies do: otherwise a test pet turns up as a buddy on everyone's devices at home
const relayAllowed = !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || /[?&]relay=1\b/.test(location.search);
async function connectRelay() {
  if (!running || relay || !relayAllowed) return;
  let v4 = '';  // the home's shared address: a Knomi on the same Wi-Fi shows the relay that one
  try { v4 = (await (await fetch(UTF8ToString(Module._webRelayV4Url()), { cache: 'no-store' })).text()).trim(); } catch (e) {}
  if (!running) return;
  const ws = new WebSocket(UTF8ToString(Module._webRelayUrl()) + (/^\d{1,3}(\.\d{1,3}){3}$/.test(v4) ? '?v4=' + v4 : ''));
  ws.binaryType = 'arraybuffer';
  relay = ws;
  ws.onopen = () => { relayTries = 0; Module._webRelayUp(1); };
  const ping = setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 45000);  // keeps it open; the relay answers "pong" for free
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {  // {"n": others in the group}
      try { Module._webRelayPeers(JSON.parse(e.data).n | 0); } catch (x) {}
      return;
    }
    const b = new Uint8Array(e.data);
    if (b.length !== 65) return;
    if (!relayIn) relayIn = Module._malloc(65);
    HEAPU8.set(b, relayIn);
    Module._webRelayIn(relayIn, 65);
  };
  ws.onclose = () => {
    clearInterval(ping);
    if (relay !== ws) return;
    relay = null;
    Module._webRelayUp(0);
    if (running) setTimeout(connectRelay, Math.min(60000, 2000 * 2 ** relayTries++));  // back off, then try again
  };
}

// ---- live players: how many Knomis, apps and tabs the relay has right now (it keeps the number a minute) ----
async function showLive() {
  const live = document.getElementById('live');
  try {
    const url = UTF8ToString(Module._webRelayUrl()).replace(/^ws/, 'http').replace(/\/ws$/, '/stats');
    const { online } = await (await fetch(url)).json();
    live.textContent = 'Live players: ' + online;
    live.hidden = !(online > 0);
  } catch (e) { live.hidden = true; }
}

// ---- size: like the Mac app; each one shrinks to fit a smaller screen ----
const SIZES = [['Small', 260], ['Medium', 380], ['Large', 520]];
let sizeAt = 0;  // Small, unless they picked another
try {
  const kept = SIZES.findIndex((s) => s[0] === localStorage.getItem('pwg-size'));
  if (kept >= 0) sizeAt = kept;
} catch (e) {}
const sizeBtn = document.getElementById('size');
function applySize() {
  const [name, px] = SIZES[sizeAt];
  document.documentElement.style.setProperty('--side', `min(var(--fit), ${px}px)`);
  sizeBtn.textContent = 'Size: ' + name;
  try { localStorage.setItem('pwg-size', name); } catch (e) {}
}
sizeBtn.addEventListener('click', () => { sizeAt = (sizeAt + 1) % SIZES.length; applySize(); });
applySize();

// Shown bigger than its 466 pixels, the screen keeps its pixels square and sharp; shown smaller (a
// small window, a screen without Retina), whole rows and columns would drop out and the pixel art
// would break up: there it is scaled smoothly instead.
function applySmoothing() {
  const px = canvas.getBoundingClientRect().width * (window.devicePixelRatio || 1);
  canvas.style.imageRendering = px >= 466 ? 'pixelated' : 'auto';
}
new ResizeObserver(applySmoothing).observe(canvas);
window.addEventListener('resize', applySmoothing);
applySmoothing();

// ---- a tab left open: offers the new version once one is published. With Auto-update on (the game's
// setting, kept with the save like the Knomi's switch) it reloads onto it by itself, once nobody is
// playing: the home screen showing, nothing being decided or played with a buddy, no tap for a minute ----
const updBtn = document.getElementById('upd');
let newBuild = false;
function reloadToNew() { if (running) Module._webSave(); sync(() => location.reload()); }
updBtn.addEventListener('click', reloadToNew);
setInterval(async () => {
  try {
    const v = await (await fetch('version.json', { cache: 'no-store' })).json();
    if (v.build && v.build !== BUILD) newBuild = true, updBtn.style.display = 'block';
  } catch (e) {}
}, 60 * 60 * 1000);
setInterval(() => {
  if (newBuild && running && Module._webAutoUpdate() && Module._webQuietForUpdate()) newBuild = false, reloadToNew();
}, 10000);
const autoBtn = document.getElementById('auto');
function updateAutoButton() { autoBtn.textContent = 'Auto-update: ' + (Module._webAutoUpdate() ? 'On' : 'Off'); }
autoBtn.addEventListener('click', () => {
  if (!running) return;
  Module._webSetAutoUpdate(Module._webAutoUpdate() ? 0 : 1);
  updateAutoButton();
});

// ---- export / import the save file ----
document.getElementById('export').addEventListener('click', () => {
  Module._webSave();
  let data;
  try { data = FS.readFile(SAVE_FILE); } catch (e) { alert('There is no save yet: pick your first Pokémon.'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'text/plain' }));
  a.download = 'pokewebgochi-' + new Date().toISOString().slice(0, 10) + '.prefs';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.getElementById('import').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const text = await file.text();
  // a save is "key hex" lines; anything else is turned away before it replaces anything
  const lines = text.trim().split('\n');
  if (!lines.length || !lines.every((l) => /^[A-Za-z0-9_]{1,31} ([0-9a-f]+|-)$/.test(l.trim()))) {
    alert('That file is not a PokeWebGochi save.');
    return;
  }
  if (!confirm('Replace the Pokémon on this page with the one in ' + file.name + '?')) return;
  skipSave = true;
  FS.writeFile(SAVE_FILE, text);
  sync(() => location.reload());
});
</script>
<script src="pokewebgochi.js?v=ce00627d04"></script>
</body>
</html>
